<!DOCTYPE html>
<html>
<head>
    <title>Connection Requests</title>
</head>

<body>
    <h1>Connection Requests</h1>

    {% for req in connection_requests %}
    <p>
      Student: {{ req[1] }} 
      Mentor: {{ req[2] }} - {{ req[3] }} 
      Status: {{ req[4] }}
      <form action="/accept-request" method="post" style="display:inline;">
        <input type="hidden" name="request_id" value="{{ req[0] }}">
        <button type="submit">Accept</button>
      </form>

      <form action="/decline-request" method="POST" style="display:inline;">
        <input type="hidden" name="request_id" value="{{ req[0] }}"> 
        <button type="submit">Decline</button>
      </form>
    </p>
    {% else %}
    <p>No connection requests yet.</p>
    {% endfor %}

    <br>
    <a href="/mentor_dashboard">Back</a> 
</body>
</html>
